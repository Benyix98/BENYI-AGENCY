<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benia Agency — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }

    /* LOGIN */
    #login-screen {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .login-card {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
      padding: 2.5rem; width: 360px;
    }
    .login-card h1 { font-size: 1.4rem; margin-bottom: 0.4rem; color: #fff; }
    .login-card p { font-size: 0.85rem; color: #888; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.4rem; }
    .form-group input {
      width: 100%; padding: 0.7rem 1rem; background: #111; border: 1px solid #333;
      border-radius: 8px; color: #fff; font-size: 0.9rem; outline: none;
    }
    .form-group input:focus { border-color: #22c55e; }
    .btn-primary {
      width: 100%; padding: 0.75rem; background: #22c55e; color: #000;
      border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
      cursor: pointer; transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }
    #login-error { color: #f87171; font-size: 0.82rem; margin-top: 0.8rem; display: none; }

    /* DASHBOARD */
    #dashboard { display: none; }
    .topbar {
      background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
      padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
    }
    .topbar h1 { font-size: 1.1rem; color: #22c55e; }
    .topbar button {
      background: transparent; border: 1px solid #333; color: #aaa;
      padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    .topbar button:hover { border-color: #f87171; color: #f87171; }
    .main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 1.2rem 1.5rem;
    }
    .stat-card .label { font-size: 0.78rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: #fff; margin-top: 0.3rem; }
    .stat-card .value.green { color: #22c55e; }
    .stat-card .value.yellow { color: #fbbf24; }
    .stat-card .value.red { color: #f87171; }

    .section-title { font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 1rem; }
    .filters { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .filter-btn {
      padding: 0.4rem 1rem; border-radius: 20px; border: 1px solid #333;
      background: transparent; color: #aaa; font-size: 0.82rem; cursor: pointer; transition: all 0.2s;
    }
    .filter-btn.active { background: #22c55e; color: #000; border-color: #22c55e; font-weight: 600; }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 0.7rem 1rem; font-size: 0.75rem;
      color: #666; text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 1px solid #2a2a2a;
    }
    td { padding: 0.9rem 1rem; font-size: 0.88rem; border-bottom: 1px solid #1e1e1e; vertical-align: top; }
    tr:hover td { background: #161616; }
    .badge {
      display: inline-block; padding: 0.25rem 0.6rem; border-radius: 20px;
      font-size: 0.75rem; font-weight: 600;
    }
    .badge.pendiente { background: #1f2937; color: #fbbf24; }
    .badge.contactado { background: #052e16; color: #22c55e; }
    .badge.cerrado { background: #1f1f1f; color: #6b7280; }

    .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .action-btn {
      padding: 0.3rem 0.7rem; border-radius: 6px; border: 1px solid #333;
      background: transparent; color: #aaa; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
    }
    .action-btn:hover { border-color: #22c55e; color: #22c55e; }
    .action-btn.delete:hover { border-color: #f87171; color: #f87171; }

    .goal-text { max-width: 280px; color: #aaa; line-height: 1.4; }
    .date-text { color: #666; font-size: 0.8rem; white-space: nowrap; }
    .empty { text-align: center; padding: 3rem; color: #555; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h1>Benia Agency</h1>
    <p>Panel de administración</p>
    <form id="login-form">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Entrar</button>
      <p id="login-error">Usuario o contraseña incorrectos</p>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <h1>Benia Agency — Admin</h1>
    <button id="logout-btn">Cerrar sesión</button>
  </div>
  <div class="main">
    <div class="stats">
      <div class="stat-card">
        <div class="label">Total leads</div>
        <div class="value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Pendientes</div>
        <div class="value yellow" id="stat-pending">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Contactados</div>
        <div class="value green" id="stat-contacted">—</div>
      </div>
    </div>

    <div class="section-title">Leads</div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="pendiente">Pendientes</button>
      <button class="filter-btn" data-filter="contactado">Contactados</button>
      <button class="filter-btn" data-filter="cerrado">Cerrados</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Empresa</th>
          <th>Email</th>
          <th>Objetivo</th>
          <th>Estado</th>
          <th>Fecha</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="leads-table"></tbody>
    </table>
  </div>
</div>

<script>
  const API = '/api/admin';
  let token = localStorage.getItem('benia_token');
  let allLeads = [];
  let activeFilter = 'all';

  // Escapa HTML para evitar XSS almacenado: los leads vienen del formulario
  // público y NO son de confianza. Nunca insertar sus campos sin pasar por aquí.
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  if (token) showDashboard();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });

    if (res.ok) {
      const data = await res.json();
      token = data.token;
      localStorage.setItem('benia_token', token);
      document.getElementById('login-error').style.display = 'none';
      showDashboard();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('benia_token');
    token = null;
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderTable();
    });
  });

  async function showDashboard() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    await loadLeads();
  }

  async function loadLeads() {
    const res = await fetch(`${API}/leads`, {
      headers: { Authorization: `Bearer ${token}` },
    });

    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem('benia_token');
      location.reload();
      return;
    }

    allLeads = await res.json();
    updateStats();
    renderTable();
  }

  function updateStats() {
    document.getElementById('stat-total').textContent = allLeads.length;
    document.getElementById('stat-pending').textContent = allLeads.filter(l => l.status === 'pendiente').length;
    document.getElementById('stat-contacted').textContent = allLeads.filter(l => l.status === 'contactado').length;
  }

  function renderTable() {
    const filtered = activeFilter === 'all' ? allLeads : allLeads.filter(l => l.status === activeFilter);
    const tbody = document.getElementById('leads-table');

    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">No hay leads en esta categoría</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(lead => `
      <tr>
        <td>${esc(lead.id)}</td>
        <td><strong>${esc(lead.company)}</strong></td>
        <td><a href="mailto:${encodeURIComponent(lead.email)}" style="color:#22c55e">${esc(lead.email)}</a></td>
        <td><div class="goal-text">${esc(lead.goal)}</div></td>
        <td><span class="badge ${esc(lead.status)}">${esc(lead.status)}</span></td>
        <td><div class="date-text">${new Date(lead.created_at).toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' })}</div></td>
        <td>
          <div class="actions">
            ${lead.status !== 'contactado' ? `<button class="action-btn" onclick="changeStatus(${lead.id},'contactado')">Contactado</button>` : ''}
            ${lead.status !== 'cerrado' ? `<button class="action-btn" onclick="changeStatus(${lead.id},'cerrado')">Cerrar</button>` : ''}
            ${lead.status !== 'pendiente' ? `<button class="action-btn" onclick="changeStatus(${lead.id},'pendiente')">Reabrir</button>` : ''}
            <button class="action-btn delete" onclick="deleteLead(${lead.id})">Eliminar</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  async function changeStatus(id, status) {
    await fetch(`${API}/leads/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ status }),
    });
    await loadLeads();
  }

  async function deleteLead(id) {
    if (!confirm('¿Eliminar este lead?')) return;
    await fetch(`${API}/leads/${id}`, {
      method: 'DELETE',
      headers: { Authorization: `Bearer ${token}` },
    });
    await loadLeads();
  }
</script>
</body>
</html>
