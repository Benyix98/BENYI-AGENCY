<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker | BENIA AGENCY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --primary: #22C55E;
            --bg: #000000;
            --card-bg: #09090B;
            --border: rgba(34, 197, 94, 0.2);
        }

        body {
            background-color: var(--bg);
            color: white;
            padding-top: 120px;
            overflow-y: auto !important;
            /* Allow scrolling on this page */
        }

        .tracker-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .tracker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .header-info h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header-info p {
            color: #A1A1AA;
        }

        .tracker-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        th {
            text-align: left;
            padding: 1rem;
            color: var(--primary);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        td {
            padding: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        td:first-child {
            border-radius: 12px 0 0 12px;
            font-weight: 600;
            width: 250px;
        }

        td:last-child {
            border-radius: 0 12px 12px 0;
        }

        .habit-row:hover td {
            border-color: var(--primary);
            background: rgba(34, 197, 94, 0.05);
        }

        /* Essential for Analysis logic */
        .disabled-cell {
            background: rgba(255, 255, 255, 0.02) !important;
            border-color: rgba(255, 255, 255, 0.05) !important;
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Custom Checkbox */
        .cb-container {
            display: block;
            position: relative;
            cursor: pointer;
            width: 24px;
            height: 24px;
            margin: 0 auto;
        }

        .cb-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 24px;
            width: 24px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cb-container:hover input ~ .checkmark {
            border-color: var(--primary);
        }

        .cb-container input:checked ~ .checkmark {
            background-color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 7px;
            top: 3px;
            width: 6px;
            height: 11px;
            border: solid white;
            border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg);
        }

        .cb-container input:checked ~ .checkmark:after {
            display: block;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.3rem 0.8rem;
            border-radius: 100px;
            background: rgba(34, 197, 94, 0.1);
            color: var(--primary);
            border: 1px solid var(--border);
        }

        /* Back Button */
        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: white;
            font-weight: 500;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            color: var(--primary);
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .tracker-container {
                padding: 1rem;
                overflow-x: auto;
            }
            .tracker-table {
                min-width: 800px;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar" style="height: 80px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);">
        <div class="container nav-container">
            <a href="index.html" class="logo-link">
                <img src="images/logo.png" alt="BENIA Logo" style="height: 50px;">
            </a>
        </div>
    </nav>

    <main class="container">
        <a href="index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Volver al Inicio
        </a>

        <div class="tracker-container">
            <div class="tracker-header">
                <div class="header-info">
                    <h1 class="gradient-text">Habit Tracker</h1>
                    <p>Optimiza tu rendimiento diario con sistemas de alta frecuencia.</p>
                </div>
                <div class="status-badge">Marzo 2026</div>
            </div>

            <table class="tracker-table">
                <thead>
                    <tr>
                        <th>Habit</th>
                        <th>Lun</th>
                        <th>Mar</th>
                        <th>Mie</th>
                        <th>Jue</th>
                        <th>Vie</th>
                        <th>Sab</th>
                        <th>Dom</th>
                    </tr>
                </thead>
                <tbody id="tracker-body">
                    <!-- Habits will be injected here -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const habits = [
            { id: 'lectura', name: '📖 Lectura', days: [0, 1, 2, 3, 4, 5, 6] },
            { id: 'gym', name: '💪 GYM', days: [0, 1, 2, 3, 4, 5, 6] },
            { id: 'entrenamiento', name: '⚽ Entrenamiento', days: [0, 1, 2, 3, 4, 5, 6] },
            { id: 'analisis', name: '📊 Análisis', days: [1, 3, 5] } // Tue (1), Thu (3), Sat (5)
        ];

        const daysOfWeek = ['lun', 'mar', 'mie', 'jue', 'vie', 'sab', 'dom'];

        function renderTracker() {
            const tbody = document.getElementById('tracker-body');
            tbody.innerHTML = '';

            habits.forEach(habit => {
                const row = document.createElement('tr');
                row.className = 'habit-row';

                let rowHtml = `<td>${habit.name}</td>`;

                for (let i = 0; i < 7; i++) {
                    const isEnabled = habit.days.includes(i);
                    const cellId = `${habit.id}_${daysOfWeek[i]}`;
                    const isChecked = localStorage.getItem(cellId) === 'true';

                    if (isEnabled) {
                        rowHtml += `
                            <td>
                                <label class="cb-container">
                                    <input type="checkbox" id="${cellId}" ${isChecked ? 'checked' : ''} onchange="saveHabit('${cellId}')">
                                    <span class="checkmark"></span>
                                </label>
                            </td>
                        `;
                    } else {
                        rowHtml += `<td class="disabled-cell"></td>`;
                    }
                }

                row.innerHTML = rowHtml;
                tbody.appendChild(row);
            });
        }

        function saveHabit(id) {
            const checkbox = document.getElementById(id);
            localStorage.setItem(id, checkbox.checked);
        }

        window.onload = renderTracker;
    </script>
</body>

</html>
